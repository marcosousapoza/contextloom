{% extends "base.html" %}
{% block content %}<div class="page-heading"><div><p class="eyebrow">Recoverable storage</p><h1>Archives</h1></div></div><section class="panel archive-list">{% for archive in archives %}<article><div><h2>{{ archive.name }}</h2><time>{{ archive.created_at|date:"M j, Y, P" }}</time></div><div class="actions"><form method="post" action="{% url 'knowledge:archive_restore' archive.id %}">{% csrf_token %}<button class="primary">Restore</button></form><form method="post" action="{% url 'knowledge:archive_delete' archive.id %}">{% csrf_token %}<button class="danger">Delete forever</button></form></div></article>{% empty %}<p class="empty">No archived categories.</p>{% endfor %}</section>{% endblock %}
