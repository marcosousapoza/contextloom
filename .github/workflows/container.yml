name: Container

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: container-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  podman-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: quay.io/podman/stable:v5.4
      options: --privileged
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Verify Podman runtime
        run: |
          podman --version
          podman info --format '{{.Version.Version}}'

      - name: Run production deployment smoke test
        run: tests/container_smoke.sh
